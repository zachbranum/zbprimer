<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" role="banner" aria-label="Site header">
      <div class="container header-inner">
        <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
        <nav class="site-nav" aria-label="Primary navigation">
          <ul>
            <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
            <li><a href="{{ '/pages/transmission-view/' | relative_url }}"{% if page.url == '/pages/transmission-view/' %} aria-current="page"{% endif %}>Transmission View</a></li>
            <li><a href="{{ '/pages/meaning-and-culture/' | relative_url }}"{% if page.url == '/pages/meaning-and-culture/' %} aria-current="page"{% endif %}>Meaning & Culture</a></li>
            <li><a href="{{ '/pages/interpretation-and-power/' | relative_url }}"{% if page.url == '/pages/interpretation-and-power/' %} aria-current="page"{% endif %}>Interpretation & Power</a></li>
            <li><a href="{{ '/pages/interpretation-and-intention/' | relative_url }}"{% if page.url == '/pages/interpretation-and-intention/' %} aria-current="page"{% endif %}>Interpretation & Intention</a></li>
            <li><a href="{{ '/pages/reader-guidance/' | relative_url }}"{% if page.url == '/pages/reader-guidance/' %} aria-current="page"{% endif %}>What to Do</a></li>
            <li><a href="{{ '/pages/how-i-built-this-site/' | relative_url }}"{% if page.url == '/pages/how-i-built-this-site/' %} aria-current="page"{% endif %}>How I Built This Site</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container" role="main" tabindex="-1" aria-label="Page content">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo" aria-label="Site footer">
      <div class="container">
        <p>© {{ "now" | date: "%Y" }} {{ site.github_username }}. Built with Jekyll for GitHub Pages.</p>
      </div>
    </footer>
  </body>
</html>
